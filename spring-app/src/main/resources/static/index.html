<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Extraction Factures & Relevés (Kotlin)</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; background: #f5f5f5; color: #333; }
    h1 { margin-bottom: 0.5rem; }
    .panel { background: #fff; padding: 1.5rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 1.5rem; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input[type="file"] { margin-top: 0.5rem; }
    button { margin-top: 1.5rem; padding: 0.75rem 1.2rem; background: #0066cc; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    button:disabled { background: #9aa5b1; cursor: not-allowed; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { padding: 0.5rem; border: 1px solid #ddd; font-size: 0.9rem; }
    th { background: #f0f0f0; text-align: left; }
    pre { background: #1e1e1e; color: #dcdcdc; padding: 1rem; border-radius: 6px; overflow: auto; }
    .status { margin-top: 1rem; font-style: italic; }
    .grid { display: grid; gap: 1.5rem; }
  </style>
</head>
<body>
  <div class="panel">
    <h1>Pipeline OCR Kotlin</h1>
    <p>Cette page appelle l'API Spring Boot pour extraire les données clés des factures et analyser un relevé bancaire. Les PDF natifs sont lus via PDFBox, les scans passent par Tesseract (fra+eng).</p>
  </div>

  <div class="grid">
    <div class="panel">
      <h2>Extraire des factures</h2>
      <form id="invoice-form">
        <label>Factures (PDF ou images)</label>
        <input type="file" id="invoice-files" accept="application/pdf,image/*" multiple required />
        <button type="submit" id="invoice-submit">Lancer l'extraction</button>
        <div class="status" id="invoice-status"></div>
      </form>
      <div id="invoice-results"></div>
    </div>

    <div class="panel">
      <h2>Analyser un relevé bancaire</h2>
      <form id="statement-form">
        <label>Relevé (PDF, image, CSV, XLS, XLSX)</label>
        <input type="file" id="statement-file" accept="application/pdf,image/*,text/csv,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" required />
        <button type="submit" id="statement-submit">Analyser le relevé</button>
        <div class="status" id="statement-status"></div>
      </form>
      <div id="statement-results"></div>
    </div>
  </div>

  <script>
    async function callApi(url, formData) {
      const response = await fetch(url, { method: 'POST', body: formData });
      if (!response.ok) {
        let message = `Erreur ${response.status}`;
        try {
          const payload = await response.json();
          message = payload.message || payload.error || message;
        } catch (_) {
          const text = await response.text();
          if (text) message = text;
        }
        throw new Error(message);
      }
      return response.json();
    }

    function renderInvoiceTable(invoices) {
      if (!invoices.length) {
        return '<p>Aucune facture détectée.</p>';
      }
      const rows = invoices.map(inv => `
        <tr>
          <td>${inv.filename}</td>
          <td>${inv.invoiceNumber || ''}</td>
          <td>${inv.invoiceDate || ''}</td>
          <td>${inv.totalAmount ?? ''}</td>
          <td>${inv.currency || ''}</td>
        </tr>`).join('');
      return `<table>
        <thead>
          <tr><th>Fichier</th><th>N° facture</th><th>Date</th><th>Total</th><th>Devise</th></tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>`;
    }

    function renderTransactionsTable(result) {
      if (!result.transactions || !result.transactions.length) {
        return '<p>Aucune transaction détectée.</p>';
      }
      const rows = result.transactions.map(tx => `
        <tr>
          <td>${tx.date || ''}</td>
          <td>${tx.description || ''}</td>
          <td>${tx.amount ?? ''}</td>
        </tr>`).join('');
      return `<div>
        <table>
          <thead><tr><th>Date</th><th>Description</th><th>Montant</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
        ${result.rawText ? `<details><summary>Texte complet (OCR)</summary><pre>${result.rawText}</pre></details>` : ''}
      </div>`;
    }

    document.getElementById('invoice-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const input = document.getElementById('invoice-files');
      const files = Array.from(input.files || []);
      const status = document.getElementById('invoice-status');
      const container = document.getElementById('invoice-results');
      const submit = document.getElementById('invoice-submit');
      container.innerHTML = '';
      status.textContent = 'Extraction en cours...';
      submit.disabled = true;

      try {
        if (!files.length) {
          throw new Error('Sélectionnez au moins un fichier');
        }
        const formData = new FormData();
        files.forEach(file => formData.append('files', file));
        const data = await callApi('/api/documents/invoices/extract', formData);
        container.innerHTML = renderInvoiceTable(data);
        status.textContent = `Extraction terminée (${data.length} facture(s)).`;
      } catch (error) {
        status.textContent = `Erreur: ${error.message}`;
      } finally {
        submit.disabled = false;
      }
    });

    document.getElementById('statement-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const input = document.getElementById('statement-file');
      const file = input.files[0];
      const status = document.getElementById('statement-status');
      const container = document.getElementById('statement-results');
      const submit = document.getElementById('statement-submit');
      container.innerHTML = '';
      status.textContent = 'Analyse en cours...';
      submit.disabled = true;

      try {
        if (!file) {
          throw new Error('Sélectionnez un relevé bancaire');
        }
        const formData = new FormData();
        formData.append('file', file);
        const data = await callApi('/api/documents/bank-statements/extract', formData);
        container.innerHTML = renderTransactionsTable(data);
        status.textContent = `Analyse terminée (${data.transactions.length} transaction(s)).`;
      } catch (error) {
        status.textContent = `Erreur: ${error.message}`;
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
